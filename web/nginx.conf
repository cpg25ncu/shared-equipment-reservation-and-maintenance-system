# Vite fingerprints built assets; revalidate the HTML shell and other unversioned files.
map $uri $serms_cache_control {
    default "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}[.][^/]+$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # Spring Security already sends X-Content-Type-Options and X-Frame-Options on API responses;
    # only the headers it does not send are added here, so none is duplicated.
    location /api/ {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # React pages and assets. 'unsafe-inline' is limited to styles: Radix dialogs insert <style>
    # elements at runtime. Scripts, connections, frames and forms stay same-origin.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control $serms_cache_control always;
        try_files $uri $uri/ /index.html;
    }
}
