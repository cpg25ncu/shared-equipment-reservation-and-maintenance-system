# Vite fingerprints built assets; revalidate the HTML shell and other unversioned files.
map $uri $serms_cache_control {
    default "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}[.][^/]+$" "public, max-age=31536000, immutable";
}

# Load balancing (report AD-07): every `app` replica sits behind one upstream. Docker's embedded
# DNS returns one address per replica; `resolve` re-reads it every 2 s, so replicas added or
# replaced by a rolling deploy join and leave the pool without reloading nginx. The pool is
# stateless because sessions live in PostgreSQL (Spring Session JDBC).
resolver 127.0.0.11 valid=2s ipv6=off;
resolver_timeout 2s;

# Edge rate limiting (report AD-20). Host nginx terminates TLS and forwards the client address in
# X-Forwarded-For; trust it only from the Docker bridge and loopback. Requests that still come from
# a private address (local checks, load tests, a host proxy that sends no client IP) are not
# limited, so a missing header can never throttle every user as one client.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $serms_private_client {
    default 0;
    127.0.0.0/8 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    ::1/128 1;
}
map $serms_private_client $serms_limit_key {
    1 "";
    default $binary_remote_addr;
}
# Sign-in: 10 per minute per client (burst 20) against password guessing; API: 20 per second.
limit_req_zone $serms_limit_key zone=serms_login:10m rate=10r/m;
limit_req_zone $serms_limit_key zone=serms_api:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

# GET and HEAD are safe to replay when nginx itself could not reach any replica.
map $request_method $serms_idempotent {
    default 0;
    GET 1;
    HEAD 1;
}

upstream app_pool {
    zone app_pool 64k;
    least_conn;
    # Docker DNS lists a replica as soon as its container exists, before it listens, and keeps a
    # stopped one for up to `valid`. Failing peers are therefore never parked (max_fails=0):
    # each request simply moves on to the next replica (see proxy_next_upstream below).
    server app:8081 resolve max_fails=0;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # Spring Security already sends X-Content-Type-Options and X-Frame-Options on API responses;
    # only the headers it does not send are added here, so none is duplicated.
    # Metrics are scraped by Prometheus on the internal network only.
    location = /api/v1/prometheus {
        return 404;
    }
    location = /api/v1/auth/login {
        limit_req zone=serms_login burst=20 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass http://app_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 0;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 1s;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 429 '{"type":"/problems/rate-limited","title":"Too many requests","status":429,"detail":"Too many requests from this address. Wait a minute and try again."}';
    }
    location /api/ {
        limit_req zone=serms_api burst=100 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass http://app_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Retry another replica only when the request cannot have reached the application
        # (connection errors, 502/503 from a stopping replica). POST/PATCH are never replayed.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 0;
        proxy_next_upstream_timeout 10s;
        # Replicas share a host network: a connect that is not immediate means the replica is gone.
        proxy_connect_timeout 1s;
        # A 502/503/504 generated by nginx (never by the application: proxy_intercept_errors is
        # off) means no replica received the request. During a pool change, replay GET/HEAD once.
        error_page 502 503 504 = @api_retry;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location @api_retry {
        if ($serms_idempotent = 0) {
            return 502;
        }
        proxy_pass http://app_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 0;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 1s;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # React pages and assets. 'unsafe-inline' is limited to styles: Radix dialogs insert <style>
    # elements at runtime. Scripts, connections, frames and forms stay same-origin.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control $serms_cache_control always;
        try_files $uri $uri/ /index.html;
    }
}
