global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: serms-app
    metrics_path: /api/v1/prometheus
    # One A record per replica: scaling or a rolling deploy changes the targets automatically.
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8081
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
