groups:
  - name: serms
    rules:
      - alert: SermsReplicaDown
        expr: up{job="serms-app"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'App replica {{ $labels.instance }} is not answering metrics scrapes'
      - alert: SermsTooFewReplicas
        expr: count(up{job="serms-app"} == 1) < 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Fewer than two healthy app replicas behind the load balancer'
      - alert: SermsHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="serms-app",uri=~"/api/.*"}[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'API p95 latency above the 2 s target'
      - alert: SermsHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="serms-app",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="serms-app"}[5m])), 1e-9) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'More than 2% of API requests fail with 5xx'
      - alert: SermsDbPoolSaturated
        expr: max by (instance) (hikaricp_connections_pending{job="serms-app"}) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Requests wait for a database connection on {{ $labels.instance }}'
