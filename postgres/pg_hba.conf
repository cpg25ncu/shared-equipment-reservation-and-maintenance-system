# SERMS PostgreSQL client authentication (primary and replica). Mounted read-only and selected
# with -c hba_file, so it also applies to the existing production data volume.
# TYPE  DATABASE     USER  ADDRESS        METHOD
# Inside the container (docker exec pg_dump / pg_basebackup / psql): Unix socket only.
local   all          all                  trust
local   replication  all                  trust
host    all          all   127.0.0.1/32   trust
host    all          all   ::1/128        trust
# Other containers on the internal backend network (app replicas, db-replica): password.
host    replication  all   all            scram-sha-256
host    all          all   all            scram-sha-256
