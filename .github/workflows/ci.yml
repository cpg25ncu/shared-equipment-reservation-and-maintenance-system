# Security checks in this workflow: gitleaks, Trivy filesystem scanning, and Dependency Review.
#
#   secrets-scan       gitleaks: scans the full Git history for committed API keys / private keys
#   vuln-scan          Trivy: scans dependency manifests and configuration for known vulnerabilities / misconfigurations
#   dependency-review  GitHub Dependency Review: rejects newly introduced HIGH/CRITICAL dependency vulnerabilities on PRs
#
# Application builds/tests: frontend-tests.yml (backend/OpenAPI and frontend),
# notification-tests.yml (application regression and PostgreSQL), database.yml,
# zhoufanhao.yml (UC03), approval-postgres-tests.yml (UC02), maintenance-tests.yml (UC04),
# and notification-contract.yml (notification adapter). release-config.yml builds/scans
# app/web images and runs production-profile Compose smoke checks. CodeQL runs in codeql.yml.
#
# Two gates, verified on 2026-10-24:
# - Merge: main branch protection requires 8 checks, including these 3 security checks.
# - Release: scripts/verify-release.mjs requiredChecks requires 12 checks on current main.
# See docs/tech-stack.md section 3.3 for the lists; repository settings and the script
# are the respective sources of truth. ZAP and k6 are manual, outside these workflows.
name: CI

on:
  # No paths-ignore: branch protection requires these three security checks on PRs, and the release gate
  # (scripts/verify-release.mjs) requires them on the main SHA, including documentation-only pushes.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history; otherwise only the latest commit is scanned.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln-scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Post the review summary in the PR.
    steps:
      - uses: actions/checkout@v4
      # Only PR events have comparable base/head revisions; pushes to main pass without review so the required check remains present.
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
